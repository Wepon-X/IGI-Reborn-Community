name: Bug report
description: Report a reproducible problem in the project.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Please check existing issues and do not include personal or sensitive information."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: godot
    attributes:
      label: Godot version
  - type: input
    id: hardware
    attributes:
      label: Hardware / OS
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove usernames, tokens, paths, and other private data.
