name: Feature proposal
description: Propose a gameplay, technical, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What player or developer need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Scope, risks, and performance impact
  - type: checkboxes
    id: policy
    attributes:
      label: Project policy
      options:
        - label: This proposal does not rely on unlicensed franchise material or assets.
          required: true
